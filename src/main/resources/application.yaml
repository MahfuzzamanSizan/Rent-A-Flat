spring:
  application:
    name: rentflat

  # 1. Database Configuration (PostgreSQL in Docker)
  datasource:
    url: jdbc:postgresql://localhost:5432/rent_ease_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # 2. JPA & Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # 'update' adds columns/tables automatically.
      # 'validate' is safer once you have Flyway scripts.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # 3. Redis Configuration (For Caching)
  data:
    redis:
      host: localhost
      port: 6379
      # password: your_redis_password (if set in docker-compose)

  # 4. Database Migration (Flyway)
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# 5. Server Configuration
server:
  port: 8080
  error:
    include-message: always

# 6. JWT Configuration
jwt:
  # Base64-encoded 256-bit secret — change this in production!
  secret: UmVudEVhc2VTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb24yMDI2UmVudEVhc2VBcHA=
  access-token-expiration: 900000        # 15 minutes (ms)
  refresh-token-expiration: 2592000000   # 30 days (ms)

# 7. Logging for easier debugging
logging:
  level:
    org.springframework.orm.jpa: DEBUG
    org.flywaydb: INFO