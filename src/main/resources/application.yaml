spring:
  application:
    name: rentflat

  # 1. Database Configuration (PostgreSQL in Docker)
#  datasource:
#    url: jdbc:postgresql://localhost:5432/rent_ease_db
#    username: postgres
#    password: password
#    driver-class-name: org.postgresql.Driver
