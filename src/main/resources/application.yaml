  datasource:
    url: jdbc:postgresql://neondb_owner:npg_DPjfBu81RFaK@ep-misty-mode-axwggcp4.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require
    username: neondb_owner
    password: npg_DPjfBu81RFaK
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # 2. JPA & Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # 'update' adds columns/tables automatically.
      # 'validate' is safer once you have Flyway scripts.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # 3. Redis Configuration (For Caching)
  data:
    redis:
      host: localhost
      port: 6379
      # password: your_redis_password (if set in docker-compose)

  # 4. Database Migration (Flyway)
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # 5. Multipart / File Upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# 6. Server Configuration
server:
  port: 8080
  error:
    include-message: always

# 7. JWT Configuration
jwt:
  # Base64-encoded 256-bit secret — change this in production!
  secret: UmVudEVhc2VTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb24yMDI2UmVudEVhc2VBcHA=
  access-token-expiration: 900000        # 15 minutes (ms)
  refresh-token-expiration: 2592000000   # 30 days (ms)

upload:
  dir: uploads
  base-url: http://192.168.0.106:8080

logging:
  level:
    org.springframework.orm.jpa: DEBUG
    org.flywaydb: INFO